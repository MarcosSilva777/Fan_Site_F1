<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificações — F1 Fan Site</title>
  <meta name="description" content="Classificação de pilotos e construtores da temporada 2026 da Fórmula 1, atualizada em tempo real.">
  <meta name="theme-color" content="#e10600">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.jolpi.ca">
  <link rel="preconnect" href="https://flagcdn.com">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23e10600'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-weight='900' font-size='28' fill='white'%3EF1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main id="main-content" class="main">
    <header class="page-header">
      <div class="container">
        <span class="page-header__eyebrow">Mundial 2026</span>
        <h1>Classificações</h1>
        <p class="page-header__lead">A disputa pelo campeonato em números: pilotos e construtores, vitórias e pontos.</p>
      </div>
    </header>

    <section class="section" style="padding-top: var(--space-10);">
      <div class="container">
        <div id="standings-tabs" class="tabs" role="tablist" aria-label="Tipo de classificação" style="margin-bottom: var(--space-8);">
          <button class="tab" role="tab" aria-selected="true" data-tab="drivers">Pilotos</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="constructors">Construtores</button>
        </div>
        <div id="standings-panel">
          <div class="loading-block"><span class="loading"></span> Carregando classificação…</div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="../js/pages/classificacoes.js"></script>
</body>
</html>
